name: 'Build and Deploy'
description: 'Build and Deploy'

inputs:
  qt_version:
    description: 'Qt version to install, or system to use the runner package'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup MSVC
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1

    - name: Ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ github.ref }}

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      if: ${{ inputs.qt_version != 'system' }}
      with:
        cache: true
        version: ${{ inputs.qt_version }}

    - name: Setup Env variables
      shell: bash
      id: envs
      run: |
        ARCH=$(uname -m)
        echo "arch=$ARCH" >> $GITHUB_OUTPUT

    - name: Clone VCG
      shell: bash
      run: |
        cd ..
        git clone --single-branch --branch devel https://github.com/cnr-isti-vclab/vcglib

    - name: Install Linux dependencies 
      shell: bash
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-common-dev libglu1-mesa-dev libglew-dev ninja-build


    - name: Configure and Build
      shell: bash
      run: |
        mkdir build
        mkdir install
        cd build
        cmake -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -GNinja -DCMAKE_INSTALL_PREFIX=../install ..
        ninja
        ninja install

    - name: Deploy Linux
      shell: bash
      if: ${{ runner.os == 'Linux' }}
      run: |
        set -euo pipefail
        INSTALL_PATH="${GITHUB_WORKSPACE}/install"
        APPDIR="$INSTALL_PATH"
        ARCH="${{ steps.envs.outputs.arch }}"
        LINUXDEPLOY="${INSTALL_PATH}/linuxdeploy-${ARCH}.AppImage"
        QT_PLUGIN="${INSTALL_PATH}/linuxdeploy-plugin-qt"

        echo "======= Preparing AppDir ======="
        mkdir -p "$APPDIR/usr"
        for directory in bin lib share; do
          if [ -d "$APPDIR/$directory" ]; then
            mv "$APPDIR/$directory" "$APPDIR/usr/$directory"
          fi
        done

        for executable in nxsbuild nxscompress nxsedit nxsview; do
          if [ -x "$APPDIR/usr/bin/$executable" ]; then
            continue
          fi
          echo "ERROR: Expected executable not found: $APPDIR/usr/bin/$executable"
          exit 1
        done

        echo "======= Bundling Qt Dependencies ======="
        wget -O "$LINUXDEPLOY" "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-${ARCH}.AppImage"
        chmod +x "$LINUXDEPLOY"
        wget -O "${QT_PLUGIN}.AppImage" "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-${ARCH}.AppImage"
        chmod +x "${QT_PLUGIN}.AppImage"
        mv "${QT_PLUGIN}.AppImage" "$QT_PLUGIN"
        export PATH="${INSTALL_PATH}:$PATH"

        "$LINUXDEPLOY" \
          --appdir="$APPDIR" \
          --executable="$APPDIR/usr/bin/nxsbuild" \
          --executable="$APPDIR/usr/bin/nxscompress" \
          --executable="$APPDIR/usr/bin/nxsedit" \
          --executable="$APPDIR/usr/bin/nxsview" \
          --plugin qt

        echo "======= Verifying Dependencies ======="
        MISSING=0
        for executable in "$APPDIR"/usr/bin/*; do
          [ -x "$executable" ] || continue
          unresolved=$(LD_LIBRARY_PATH="${APPDIR}/usr/lib:${LD_LIBRARY_PATH:-}" ldd "$executable" 2>/dev/null | grep 'not found' || true)
          if [ -n "$unresolved" ]; then
            echo "MISSING in $(basename "$executable"): $unresolved"
            MISSING=$((MISSING + 1))
          fi
        done
        if [ "$MISSING" -gt 0 ]; then
          echo "ERROR: Dependencies are missing"
          exit 1
        fi
        rm -f "$LINUXDEPLOY" "$QT_PLUGIN"

    - name: Deploy MacOS
      shell: bash
      if: ${{ runner.os == 'macOS' }}
      run: |
        set -euo pipefail
        INSTALL_PATH="${GITHUB_WORKSPACE}/install"
        APP_BUNDLE="${INSTALL_PATH}/nxsview.app"
        BUILD_APP_BUNDLE="${GITHUB_WORKSPACE}/build/src/nxsview/nxsview.app"

        echo "======= Preparing AppBundle ======="
        [ -d "$APP_BUNDLE" ] || { echo "ERROR: App bundle not found: $APP_BUNDLE"; exit 1; }

        # CMake installs these helper tools into its build-tree app bundle.
        for executable in nxsbuild nxscompress nxsedit; do
          source="$BUILD_APP_BUNDLE/Contents/MacOS/$executable"
          destination="$APP_BUNDLE/Contents/MacOS/$executable"
          if [ -x "$source" ] && [ ! -x "$destination" ]; then
            cp "$source" "$destination"
          fi
          [ -x "$destination" ] || { echo "ERROR: App bundle executable not found: $destination"; exit 1; }
        done

        echo "======= Bundling Qt Dependencies ======="
        deploy_output=$(macdeployqt "$APP_BUNDLE" \
          -executable="$APP_BUNDLE/Contents/MacOS/nxsbuild" \
          -executable="$APP_BUNDLE/Contents/MacOS/nxscompress" \
          -executable="$APP_BUNDLE/Contents/MacOS/nxsedit" 2>&1) || {
            echo "$deploy_output"
            exit 1
          }
        echo "$deploy_output"
        if [[ "$deploy_output" == *"ERROR"* ]]; then
          echo "ERROR: macdeployqt reported a deployment error"
          exit 1
        fi

        echo "======= Verifying AppBundle Dependencies ======="
        for executable in "$APP_BUNDLE"/Contents/MacOS/*; do
          [ -x "$executable" ] || continue
          unresolved=$(otool -L "$executable" | awk 'NR > 1 { print $1 }' | while IFS= read -r library; do
            case "$library" in
              /System/*|/usr/lib/*|@*) ;;
              *) printf '%s\n' "$library" ;;
            esac
          done)
          if [ -n "$unresolved" ]; then
            echo "ERROR: External dependencies in $(basename "$executable"):"
            echo "$unresolved"
            exit 1
          fi
        done

        find "$INSTALL_PATH" -mindepth 1 -maxdepth 1 ! -name 'nxsview.app' -exec rm -rf {} +
        
    - name: Deploy Windows
      shell: bash
      if: ${{ runner.os == 'Windows' }}
      run: |
        set -euo pipefail
        INSTALL_PATH="${GITHUB_WORKSPACE}/install"
        BIN_PATH="${INSTALL_PATH}/bin"
        PORTABLE_PATH="${INSTALL_PATH}/nexus_portable-${{ steps.envs.outputs.arch }}"

        echo "======= Creating Portable Version ======="
        for executable in nxsbuild nxscompress nxsedit nxsview; do
          path="$BIN_PATH/$executable.exe"
          [ -f "$path" ] || { echo "ERROR: Executable not found: $path"; exit 1; }
          windeployqt --compiler-runtime "$path"
        done

        echo "======= Verifying DLL Dependencies ======="
        SYSTEM_RE='^(api-ms-win-.*|kernel32|user32|gdi32|ole32|oleaut32|shell32|advapi32|ntdll|msvcrt|ws2_32|comctl32|comdlg32|shlwapi|winmm|imm32|version|winspool|ucrtbase|msvcp[0-9]+|vcruntime[0-9_]+)\.dll$'
        MISSING=0
        for executable in "$BIN_PATH"/nxs*.exe; do
          [ -f "$executable" ] || continue
          while IFS= read -r dll; do
            [[ "$dll" =~ $SYSTEM_RE ]] && continue
            if ! find "$BIN_PATH" -maxdepth 1 -iname "$dll" -print -quit | grep -q .; then
              echo "MISSING: $dll (needed by $(basename "$executable"))"
              MISSING=$((MISSING + 1))
            fi
          done < <(objdump -p "$executable" | awk '/DLL Name:/ { print tolower($3) }')
        done
        [ "$MISSING" -eq 0 ] || { echo "ERROR: $MISSING missing DLL(s)"; exit 1; }

        mv "$BIN_PATH" "$PORTABLE_PATH"
