name: 'Build and Deploy'
description: 'Build and Deploy'

runs:
  using: "composite"
  steps:
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      if: ${{ runner.os != 'macOS' }}
      with:
        cache: true
        version: '6.10.*'
        modules: 'qtshadertools'
    - name: Ensure Qt GuiPrivate CMake target
      if: ${{ runner.os != 'macOS' }}
      shell: bash
      run: |
        # aqt kits can ship QRhi headers without the GuiPrivate CMake wrapper.
        if [ -z "$QT_ROOT_DIR" ]; then
          echo "::error::install-qt-action did not set QT_ROOT_DIR"
          exit 1
        fi

        qt_root="$QT_ROOT_DIR"
        qt_root_cmake="$QT_ROOT_DIR"
        if command -v cygpath >/dev/null; then
          qt_root="$(cygpath -u "$QT_ROOT_DIR")"
          qt_root_cmake="$(cygpath -m "$QT_ROOT_DIR")"
        fi

        # install-qt-action uses <version>/<target> for the Qt root directory.
        qt_version="$(basename "$(dirname "$qt_root")")"
        private_headers="$qt_root/include/QtGui/$qt_version/QtGui"
        for header in qrhi.h qshader.h; do
          if [ ! -f "$private_headers/rhi/$header" ]; then
            echo "::error::Qt $qt_version private header is missing: $private_headers/rhi/$header"
            exit 1
          fi
        done

        private_dir="$qt_root/lib/cmake/Qt6GuiPrivate"
        private_config="$private_dir/Qt6GuiPrivateConfig.cmake"
        if [ -f "$private_config" ]; then
          echo "Qt6GuiPrivate CMake package is already installed"
          exit 0
        fi

        mkdir -p "$private_dir"
        cat > "$private_config" <<EOF
        set(Qt6GuiPrivate_FOUND TRUE)
        if(NOT TARGET Qt6::GuiPrivate)
          add_library(Qt6::GuiPrivate INTERFACE IMPORTED GLOBAL)
          set_property(TARGET Qt6::GuiPrivate PROPERTY _qt_is_private_module TRUE)
          target_include_directories(Qt6::GuiPrivate INTERFACE
            "${qt_root_cmake}/include/QtGui/$qt_version"
            "${qt_root_cmake}/include/QtGui/$qt_version/QtGui")
          target_link_libraries(Qt6::GuiPrivate INTERFACE Qt6::Gui)
        endif()
        EOF
        cat > "$private_dir/Qt6GuiPrivateConfigVersion.cmake" <<EOF
        set(PACKAGE_VERSION "$qt_version")
        if(PACKAGE_VERSION VERSION_LESS PACKAGE_FIND_VERSION)
          set(PACKAGE_VERSION_COMPATIBLE FALSE)
        else()
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
          if(PACKAGE_VERSION STREQUAL PACKAGE_FIND_VERSION)
            set(PACKAGE_VERSION_EXACT TRUE)
          endif()
        endif()
        EOF
    - name: Setup Env variables
      shell: bash
      id: envs
      run: |
        echo "name=VCINSTALLDIR::C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\VC" >> $GITHUB_ENV
        ARCH=$(uname -m)
        echo "arch=$ARCH" >> $GITHUB_OUTPUT
    - name: Clone VCG
      shell: bash
      run: |
        cd ..
        git clone --single-branch --branch devel https://github.com/cnr-isti-vclab/vcglib
    - name: Install dependencies Linux
      shell: bash
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt-get install -y \
          libdraco-dev \
          libglew-dev \
          libglu1-mesa-dev \
          libjpeg-dev \
          libmetis-dev \
          libpng-dev \
          libtbb-dev \
          libxkbcommon-dev \
          mesa-common-dev \
          ninja-build
    - name: Install dependencies Windows
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install tbb:x64-windows metis:x64-windows draco:x64-windows libjpeg-turbo:x64-windows libpng:x64-windows
    - name: Install dependencies macOS
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        brew install tbb metis draco
        echo "METIS_ROOT=$(brew --prefix metis)" >> "$GITHUB_ENV"
        echo "DRACO_ROOT=$(brew --prefix draco)" >> "$GITHUB_ENV"
        echo "TBB_DIR=$(brew --prefix tbb)/lib/cmake/TBB" >> "$GITHUB_ENV"
    - name: Install Qt macOS
      shell: bash
      if: ${{ runner.os == 'macOS' }}
      run: |
        brew install qt qtshadertools
        echo "CMAKE_PREFIX_PATH=$(brew --prefix qt):$(brew --prefix qtshadertools):$(brew --prefix tbb)" >> "$GITHUB_ENV"
        echo "Qt6_DIR=$(brew --prefix qt)/lib/cmake/Qt6" >> "$GITHUB_ENV"
        echo "Qt6ShaderTools_DIR=$(brew --prefix qtshadertools)/lib/cmake/Qt6ShaderTools" >> "$GITHUB_ENV"
        echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
    - name: Ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ github.ref }}
    - name: Configure and Build
      shell: bash
      run: |
        mkdir build
        mkdir install
        cd build
        cmake_args=()
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          vcpkg_root="$(cygpath -u "$VCPKG_INSTALLATION_ROOT")"
          cmake_args+=("-DCMAKE_TOOLCHAIN_FILE=$vcpkg_root/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=x64-windows")
        fi
        cmake -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -GNinja -DCMAKE_INSTALL_PREFIX=../install "${cmake_args[@]}" ..
        ninja
        ninja install
    - name: Diagnose Windows linker symbols
      if: ${{ runner.os == 'Windows' && failure() }}
      shell: pwsh
      run: |
        $toolPath = $null
        $toolArgs = @('/symbols')
        $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
        if ($dumpbin) {
          $toolPath = $dumpbin.Source
        } elseif ($env:VCToolsInstallDir) {
          $candidate = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\dumpbin.exe'
          if (Test-Path $candidate) {
            $toolPath = $candidate
          }
        }

        if (-not $toolPath) {
          $link = Get-Command link.exe -ErrorAction SilentlyContinue
          if ($link) {
            $toolPath = $link.Source
            $toolArgs = @('/dump', '/symbols')
          }
        }

        if (-not $toolPath) {
          Write-Host '::warning::Could not locate dumpbin.exe or link.exe for symbol inspection'
          exit 0
        }

        Write-Host "Using symbol inspector: $toolPath"
        foreach ($relativePath in @(
          'build\nxsbuild\CMakeFiles\nxsbuild.dir\mesh_hierarchy.cpp.obj',
          'build\nxsbuild\CMakeFiles\nxsbuild.dir\main.cpp.obj'
        )) {
          $objectPath = Join-Path $env:GITHUB_WORKSPACE $relativePath
          Write-Host "::group::Symbols containing build_hierarchy in $relativePath"
          if (-not (Test-Path $objectPath)) {
            Write-Host "::warning::Object file not found: $objectPath"
            Write-Host '::endgroup::'
            continue
          }

          $output = & $toolPath @toolArgs $objectPath 2>&1
          $toolExitCode = $LASTEXITCODE
          if ($toolExitCode -ne 0) {
            Write-Host "::warning::Symbol inspector exited with code $toolExitCode for $relativePath"
            $output | ForEach-Object { Write-Host $_ }
          } else {
            $matches = $output | Select-String -SimpleMatch 'build_hierarchy'
            if ($matches) {
              $matches | ForEach-Object { Write-Host $_.Line }
            } else {
              Write-Host 'No symbol-table entries contain build_hierarchy'
            }
          }
          Write-Host '::endgroup::'
        }
    - name: Deploy Linux
      shell: bash
      if: ${{ runner.os == 'Linux' }}
      run: |
        cd install
        # download linuxdeployqt
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-${{ steps.envs.outputs.arch }}.AppImage
        chmod +x linuxdeploy-${{ steps.envs.outputs.arch }}.AppImage
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-${{ steps.envs.outputs.arch }}.AppImage
        chmod +x linuxdeploy-plugin-qt-${{ steps.envs.outputs.arch }}.AppImage
        # deploy
        ./linuxdeploy-${{ steps.envs.outputs.arch }}.AppImage --executable=$PWD/bin/nxsbuild --executable=$PWD/bin/nxscompress --executable=$PWD/bin/nxsedit --executable=$PWD/bin/nxsview --appdir=. --plugin qt
        rm -r bin
        rm linuxdeploy-${{ steps.envs.outputs.arch }}.AppImage linuxdeploy-plugin-qt-${{ steps.envs.outputs.arch }}.AppImage
    - name: Deploy MacOS
      shell: bash
      if: ${{ runner.os == 'macOS' }}
      run: |
        cd install
        macdeployqt nxsview.app -executable=nxsview.app/Contents/MacOS/nxsbuild -executable=nxsview.app/Contents/MacOS/nxscompress -executable=nxsview.app/Contents/MacOS/nxsedit
        rm -r bin
        rm -r lib
    - name: Deploy Windows
      shell: bash
      if: ${{ runner.os == 'Windows' }}
      run: |
        cd install/bin
        windeployqt nxsview.exe
        cd ..
        mv bin nexus_portable-${{ steps.envs.outputs.arch }}
